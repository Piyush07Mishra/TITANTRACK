<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Set New Password — CatRent</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --accent-primary: #f97316;
            --accent-hover: #ea580c;
            --text-primary: #f1f5f9;
            --text-secondary: #94a3b8;
            --border-light: rgba(255, 255, 255, 0.08);
            --danger: #ef4444;
        }
        body { 
            font-family: 'Inter', sans-serif; 
            background-color: #0a0b10;
            background-image: 
                radial-gradient(at 0% 0%, rgba(249, 115, 22, 0.1) 0px, transparent 50%),
                radial-gradient(at 100% 0%, rgba(59, 130, 246, 0.1) 0px, transparent 50%),
                url("data:image/svg+xml,%3Csvg width='60' height='60' viewBox='0 0 60 60' xmlns='http://www.w3.org/2000/svg'%3E%3Cg fill='none' fill-rule='evenodd'%3E%3Cg fill='%23ffffff' fill-opacity='0.02'%3E%3Cpath d='M36 34v-4h-2v4h-4v2h4v4h2v-4h4v-2h-4zm0-30V0h-2v4h-4v2h4v4h2V6h4V4h-4zM6 34v-4H4v4H0v2h4v4h2v-4h4v-2H6zM6 4V0H4v4H0v2h4v4h2V6h4V4H6z'/%3E%3C/g%3E%3C/g%3E%3C/svg%3E");
            background-attachment: fixed;
            color: var(--text-primary); 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            min-height: 100vh; 
            margin: 0; 
        }
        .container { 
            background: rgba(20, 22, 28, 0.6);
            backdrop-filter: blur(20px);
            padding: 40px; 
            border-radius: 16px; 
            border: 1px solid rgba(255, 255, 255, 0.05); 
            max-width: 440px; 
            width: 90%; 
            text-align: center; 
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
        }
        h2 { margin-top: 0; color: var(--accent-primary); font-weight: 800; }
        p { color: var(--text-secondary); font-size: 0.95rem; margin-bottom: 24px; line-height: 1.6; }
        form p { text-align: left; margin-bottom: 15px; }
        label { display: block; font-size: 0.8rem; font-weight: 600; color: var(--text-secondary); margin-bottom: 5px; text-transform: uppercase; }
        input[type="password"] { 
            width: 100%; 
            padding: 12px; 
            border: 1.5px solid var(--border-light); 
            background: rgba(255, 255, 255, 0.05); 
            color: var(--text-primary); 
            border-radius: 10px; 
            box-sizing: border-box; 
            outline: none;
            transition: all 0.2s;
        }
        input[type="password"]:focus {
            border-color: var(--accent-primary);
            box-shadow: 0 0 0 3px rgba(249, 115, 22, 0.15);
        }
        button { 
            width: 100%; 
            padding: 13px; 
            background: linear-gradient(135deg, var(--accent-primary), var(--accent-hover));
            color: white; 
            border: none; 
            border-radius: 10px; 
            font-weight: 700; 
            cursor: pointer; 
            transition: all 0.3s;
            margin-top: 10px;
        }
        button:hover { 
            transform: translateY(-2px);
            box-shadow: 0 8px 30px rgba(249, 115, 22, 0.3);
        }
        .errorlist { color: var(--danger); list-style: none; padding: 0; text-align: left; font-size: 0.82rem; margin-bottom: 10px; }
        .helptext { display: block; font-size: 0.75rem; color: var(--text-secondary); margin-top: 4px; }
    </style>
</head>
<body>
    <div class="container">
        {% if validlink %}
            <h2>Set New Password</h2>
            <p>Please enter your new password twice to verify.</p>
            <form method="post">
                {% csrf_token %}
                {{ form.as_p }}
                <button type="submit">Change Password</button>
            </form>
        {% else %}
            <h2>Invalid Link</h2>
            <p>This password reset link is invalid or has already been used.</p>
            <a href="{% url 'password_reset' %}" style="color: var(--accent-primary); font-weight: 600; text-decoration: none;">Request new link</a>
        {% endif %}
    </div>
</body>
</html>
