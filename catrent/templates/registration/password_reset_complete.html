<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Password Reset Complete — CatRent</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --accent-primary: #f97316;
            --accent-hover: #ea580c;
            --text-primary: #f1f5f9;
            --text-secondary: #94a3b8;
            --success: #22c55e;
        }
        body { 
            font-family: 'Inter', sans-serif; 
            background-color: #0a0b10;
            background-image: 
                radial-gradient(at 0% 0%, rgba(249, 115, 22, 0.1) 0px, transparent 50%),
                radial-gradient(at 100% 0%, rgba(59, 130, 246, 0.1) 0px, transparent 50%),
                url("data:image/svg+xml,%3Csvg width='60' height='60' viewBox='0 0 60 60' xmlns='http://www.w3.org/2000/svg'%3E%3Cg fill='none' fill-rule='evenodd'%3E%3Cg fill='%23ffffff' fill-opacity='0.02'%3E%3Cpath d='M36 34v-4h-2v4h-4v2h4v4h2v-4h4v-2h-4zm0-30V0h-2v4h-4v2h4v4h2V6h4V4h-4zM6 34v-4H4v4H0v2h4v4h2v-4h4v-2H6zM6 4V0H4v4H0v2h4v4h2V6h4V4H6z'/%3E%3C/g%3E%3C/g%3E%3C/svg%3E");
            background-attachment: fixed;
            color: var(--text-primary); 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            height: 100vh; 
            margin: 0; 
        }
        .container { 
            background: rgba(20, 22, 28, 0.6);
            backdrop-filter: blur(20px);
            padding: 40px; 
            border-radius: 16px; 
            border: 1px solid rgba(255, 255, 255, 0.05); 
            max-width: 440px; 
            width: 90%; 
            text-align: center; 
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
        }
        h2 { margin-top: 0; color: var(--success); font-weight: 800; }
        p { color: var(--text-secondary); font-size: 0.95rem; margin-bottom: 24px; line-height: 1.6; }
        a { 
            display: inline-block; 
            padding: 13px 32px; 
            background: linear-gradient(135deg, var(--accent-primary), var(--accent-hover));
            color: white; 
            text-decoration: none; 
            border-radius: 10px; 
            font-weight: 700; 
            transition: all 0.3s; 
        }
        a:hover { 
            transform: translateY(-2px);
            box-shadow: 0 8px 30px rgba(249, 115, 22, 0.3);
        }
    </style>
</head>
<body>
    <div class="container">
        <h2>Password Changed!</h2>
        <p>Your password has been successfully reset. You may now log in with your new credentials.</p>
        <a href="{% url 'login' %}">Log In Now</a>
    </div>
</body>
</html>
