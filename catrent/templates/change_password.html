<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Change Password — CatRent</title>
    <meta name="description" content="Set your new CatRent account password.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-base: #0a0b10;
            --bg-card: rgba(20, 22, 28, 0.85);
            --accent-primary: #f97316;
            --accent-hover: #ea580c;
            --accent-glow: rgba(249, 115, 22, 0.2);
            --text-primary: #f1f5f9;
            --text-secondary: #94a3b8;
            --text-muted: #64748b;
            --border-light: rgba(255, 255, 255, 0.08);
            --danger: #ef4444;
            --danger-bg: rgba(239, 68, 68, 0.1);
            --danger-border: rgba(239, 68, 68, 0.25);
            --success: #22c55e;
            --radius-md: 12px;
            --radius-lg: 16px;
            --shadow-lg: 0 20px 40px rgba(0, 0, 0, 0.4);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background-color: #0a0b10;
            background-image: 
                radial-gradient(at 0% 0%, rgba(249, 115, 22, 0.1) 0px, transparent 50%),
                radial-gradient(at 100% 0%, rgba(59, 130, 246, 0.1) 0px, transparent 50%),
                url("data:image/svg+xml,%3Csvg width='60' height='60' viewBox='0 0 60 60' xmlns='http://www.w3.org/2000/svg'%3E%3Cg fill='none' fill-rule='evenodd'%3E%3Cg fill='%23ffffff' fill-opacity='0.02'%3E%3Cpath d='M36 34v-4h-2v4h-4v2h4v4h2v-4h4v-2h-4zm0-30V0h-2v4h-4v2h4v4h2V6h4V4h-4zM6 34v-4H4v4H0v2h4v4h2v-4h4v-2H6zM6 4V0H4v4H0v2h4v4h2V6h4V4H6z'/%3E%3C/g%3E%3C/g%3E%3C/svg%3E");
            background-attachment: fixed;
            min-height: 100vh;
            display: grid;
            place-items: center;
            padding: 20px;
        }



        .card {
            width: min(460px, 100%);
            background: rgba(20, 22, 28, 0.6);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 20px;
            padding: 44px 40px;
            box-shadow: var(--shadow-lg);
            position: relative;
            z-index: 1;
        }

        .lock-icon {
            text-align: center;
            margin-bottom: 24px;
        }

        .lock-icon-circle {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 72px;
            height: 72px;
            border-radius: 50%;
            background: linear-gradient(135deg, rgba(249, 115, 22, 0.12), rgba(249, 115, 22, 0.04));
            border: 1px solid rgba(249, 115, 22, 0.2);
        }

        .lock-icon-circle svg {
            color: var(--accent-orange);
        }

        .card-header {
            text-align: center;
            margin-bottom: 32px;
        }

        .card-header h1 {
            font-size: 1.6rem;
            font-weight: 700;
            color: var(--text-primary);
            margin-bottom: 10px;
        }

        .card-header p {
            font-size: 0.9rem;
            color: var(--text-muted);
            line-height: 1.6;
        }

        /* ─── ERROR BLOCK ─── */
        .error-block {
            background: var(--danger-bg);
            border: 1px solid var(--danger-border);
            border-radius: 10px;
            padding: 12px 14px;
            margin-bottom: 20px;
            display: flex;
            align-items: flex-start;
            gap: 10px;
        }

        .error-block svg { flex-shrink: 0; margin-top: 1px; }

        .error-block .error-text {
            color: var(--danger);
            font-size: 0.86rem;
            line-height: 1.5;
        }

        /* ─── FORM ─── */
        .form-group {
            margin-bottom: 20px;
        }

        .form-label {
            display: block;
            font-size: 0.82rem;
            font-weight: 600;
            color: var(--text-secondary);
            margin-bottom: 7px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .input-wrapper {
            position: relative;
        }

        .input-icon {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-muted);
            pointer-events: none;
        }

        .form-input {
            width: 100%;
            padding: 13px 14px 13px 42px;
            background: rgba(255, 255, 255, 0.05);
            border: 1.5px solid var(--border-light);
            border-radius: 10px;
            color: var(--text-primary);
            font-size: 0.95rem;
            font-family: 'Inter', sans-serif;
            transition: all 0.25s ease;
            outline: none;
        }

        .form-input:focus {
            border-color: var(--accent-primary);
            box-shadow: 0 0 0 3px var(--accent-glow);
        }

        .form-input::placeholder {
            color: var(--text-muted);
        }

        .match-indicator {
            font-size: 0.82rem;
            margin-top: 8px;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .match-ok { color: var(--success); }
        .match-fail { color: var(--danger); }

        .btn-submit {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, var(--accent-primary), var(--accent-hover));
            border: none;
            border-radius: 10px;
            color: white;
            font-size: 1rem;
            font-weight: 700;
            font-family: 'Inter', sans-serif;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 8px;
        }

        .btn-submit:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 30px rgba(249, 115, 22, 0.35);
        }

        .btn-submit:active {
            transform: translateY(0);
        }

        .note {
            text-align: center;
            margin-top: 20px;
            font-size: 0.82rem;
            color: var(--text-muted);
            line-height: 1.5;
        }

        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(24px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .card {
            animation: fadeInUp 0.7s ease-out;
        }

        @keyframes pulse {
            0%, 100% { box-shadow: 0 0 0 0 rgba(249, 115, 22, 0.2); }
            50% { box-shadow: 0 0 0 12px rgba(249, 115, 22, 0); }
        }

        .lock-icon-circle {
            animation: pulse 2.5s ease-in-out infinite;
        }

        @media (max-width: 480px) {
            .card {
                padding: 32px 24px;
            }

            .card-header h1 {
                font-size: 1.4rem;
            }
        }
    </style>
</head>
<body>
    <div class="card">
        <div class="lock-icon">
            <div class="lock-icon-circle">
                <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
                    <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
                </svg>
            </div>
        </div>

        <div class="card-header">
            <h1>Set Your New Password</h1>
            <p>Your temporary password was sent via email.<br>Please set a new secure password.</p>
        </div>

        {% if error %}
        <div class="error-block">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#ef4444" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="12" cy="12" r="10"/><line x1="15" y1="9" x2="9" y2="15"/><line x1="9" y1="9" x2="15" y2="15"/>
            </svg>
            <span class="error-text">{{ error }}</span>
        </div>
        {% endif %}

        {% if form.non_field_errors %}
        <div class="error-block">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#ef4444" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="12" cy="12" r="10"/><line x1="15" y1="9" x2="9" y2="15"/><line x1="9" y1="9" x2="15" y2="15"/>
            </svg>
            <span class="error-text">{{ form.non_field_errors.0 }}</span>
        </div>
        {% endif %}

        <form method="post" id="change-password-form">
            {% csrf_token %}

            <div class="form-group">
                <label class="form-label" for="id_new_password">New Password</label>
                <div class="input-wrapper">
                    <svg class="input-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/>
                    </svg>
                    <input type="password" name="new_password" id="id_new_password" class="form-input" placeholder="New Password (min 8 characters)" required minlength="8" oninput="checkMatch();">
                </div>
            </div>

            <div class="form-group">
                <label class="form-label" for="id_confirm_password">Confirm New Password</label>
                <div class="input-wrapper">
                    <svg class="input-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/>
                    </svg>
                    <input type="password" name="confirm_password" id="id_confirm_password" class="form-input" placeholder="Confirm New Password" required oninput="checkMatch();">
                </div>
                <div class="match-indicator" id="match-indicator"></div>
            </div>

            <button type="submit" class="btn-submit">Update Password</button>
        </form>

        <p class="note">You will remain logged in after changing your password.</p>
    </div>

    <script>
        function checkMatch() {
            const p1 = document.getElementById('id_new_password').value;
            const p2 = document.getElementById('id_confirm_password').value;
            const indicator = document.getElementById('match-indicator');

            if (!p2) {
                indicator.innerHTML = '';
                return;
            }

            if (p1 === p2) {
                indicator.innerHTML = '<span class="match-ok">✓ Passwords match</span>';
            } else {
                indicator.innerHTML = '<span class="match-fail">✕ Passwords do not match</span>';
            }
        }
    </script>
</body>
</html>
